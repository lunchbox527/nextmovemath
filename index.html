          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your net equity isn't just your sale price minus your mortgage balance. NextMoveMath subtracts realtor commissions, mortgage prepayment break penalties, legal fees and title discharges, plus home staging or moving costs to find your true bridge down payment."

          "@type": "Question",
          "name": "Can I keep my current home as a rental and pull equity out for my next down payment?",

            "@type": "Answer",
            "text": "Yes. Homeowners frequently use a Home Equity Line of Credit (HELOC) or refinance up to 65%–80% of their existing home's value to fund their next down payment, accounting for rental vacancy buffers, property taxes, HOA fees, and debt-service ratios."
          }
        },

          "@type": "Question",
          "name": "What is the Canadian mortgage stress test (+2%) and US standard DTI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "In Canada, federal rules (OSFI) require borrowers to qualify at the higher of 5.25% or contract rate plus 2.0%. In the US, conventional mortgages evaluate front-end DTI (under 28%) and back-end DTI (under 36% to 43%)."
          }
        },
        {
          "@type": "Question",
          "name": "What are the quiet closing costs that catch buyers off guard?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Quiet closing costs include land transfer taxes (PTT/LTT) or county transfer stamps, legal disbursements, title insurance, home inspections, property tax adjustments, and utility hookups, typically adding 1.5% to 3.5% of the purchase price on top of your down payment."
          }
        },
        {
          "@type": "Question",
          "name": "What is mortgage porting, and when does it make financial sense?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Porting allows you to transfer your existing mortgage interest rate, term, and balance to your new home, avoiding prepayment break penalties and blending additional borrowing if prevailing rates are higher."
          }
        }
